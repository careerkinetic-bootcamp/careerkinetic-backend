[project]
name = "careerkinetic-backend"
version = "0.1.0"
description = "FastAPI backend for CareerKinetic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn",
    "gunicorn",
    "sqlalchemy>=2.0.48",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "pyjwt>=2.12.1",
    "email-validator>=2.3.0",
    "supabase>=2.0.0",
    "pre-commit>=4.5.1",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "razorpay>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-asyncio",
    "pre-commit",
    "black",
    "isort",
    "flake8"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]


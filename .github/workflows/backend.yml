name: Deploy Backend

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'app/**'
      - 'terraform/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Determine environment variables based on the branch
      - name: Set Environment Variables
        env:
          PROD_DB_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_JWT_SEC: ${{ secrets.PROD_JWT_SECRET }}
          PROD_GOOGLE_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          PROD_GOOGLE_SEC: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          PROD_GOOGLE_URI: ${{ secrets.PROD_GOOGLE_REDIRECT_URI }}
          PROD_GITHUB_ID: ${{ secrets.PROD_GITHUB_CLIENT_ID }}
          PROD_GITHUB_SEC: ${{ secrets.PROD_GITHUB_CLIENT_SECRET }}
          PROD_GITHUB_URI: ${{ secrets.PROD_GITHUB_REDIRECT_URI }}
          DEV_DB_URL: ${{ secrets.DEV_DATABASE_URL }}
          DEV_JWT_SEC: ${{ secrets.DEV_JWT_SECRET }}
          DEV_GOOGLE_ID: ${{ secrets.DEV_GOOGLE_CLIENT_ID }}
          DEV_GOOGLE_SEC: ${{ secrets.DEV_GOOGLE_CLIENT_SECRET }}
          DEV_GOOGLE_URI: ${{ secrets.DEV_GOOGLE_REDIRECT_URI }}
          DEV_GITHUB_ID: ${{ secrets.DEV_GITHUB_CLIENT_ID }}
          DEV_GITHUB_SEC: ${{ secrets.DEV_GITHUB_CLIENT_SECRET }}
          DEV_GITHUB_URI: ${{ secrets.DEV_GITHUB_REDIRECT_URI }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "DB_URL=$PROD_DB_URL" >> $GITHUB_ENV
            echo "JWT_SEC=$PROD_JWT_SEC" >> $GITHUB_ENV
            echo "CORS_ORGS=[\"https://careerkinetic.com\"]" >> $GITHUB_ENV
            echo "GOOGLE_ID=$PROD_GOOGLE_ID" >> $GITHUB_ENV
            echo "GOOGLE_SEC=$PROD_GOOGLE_SEC" >> $GITHUB_ENV
            echo "GOOGLE_URI=$PROD_GOOGLE_URI" >> $GITHUB_ENV
            echo "GITHUB_ID=$PROD_GITHUB_ID" >> $GITHUB_ENV
            echo "GITHUB_SEC=$PROD_GITHUB_SEC" >> $GITHUB_ENV
            echo "GITHUB_URI=$PROD_GITHUB_URI" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
            echo "DB_URL=$DEV_DB_URL" >> $GITHUB_ENV
            echo "JWT_SEC=$DEV_JWT_SEC" >> $GITHUB_ENV
            echo "CORS_ORGS=[\"https://dev.careerkinetic.com\"]" >> $GITHUB_ENV
            echo "GOOGLE_ID=$DEV_GOOGLE_ID" >> $GITHUB_ENV
            echo "GOOGLE_SEC=$DEV_GOOGLE_SEC" >> $GITHUB_ENV
            echo "GOOGLE_URI=$DEV_GOOGLE_URI" >> $GITHUB_ENV
            echo "GITHUB_ID=$DEV_GITHUB_ID" >> $GITHUB_ENV
            echo "GITHUB_SEC=$DEV_GITHUB_SEC" >> $GITHUB_ENV
            echo "GITHUB_URI=$DEV_GITHUB_URI" >> $GITHUB_ENV
          fi

      # Authenticate to GCP using Workload Identity Federation
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Setup Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Initialize Terraform with isolated state
      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend-config="prefix=state/backend/${{ env.ENV }}"

      # Target-apply the Artifact Registry repository so it is created first
      - name: Terraform Target Artifact Registry
        run: |
          cd terraform
          terraform apply -target=google_artifact_registry_repository.app -auto-approve \
            -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="environment=$ENV" \
            -var="database_url=$DB_URL" \
            -var="jwt_secret=$JWT_SEC" \
            -var="google_client_id=$GOOGLE_ID" \
            -var="google_client_secret=$GOOGLE_SEC" \
            -var="google_redirect_uri=$GOOGLE_URI" \
            -var="github_client_id=$GITHUB_ID" \
            -var="github_client_secret=$GITHUB_SEC" \
            -var="github_redirect_uri=$GITHUB_URI"

      # Configure Docker Authentication for GCP Artifact Registry
      - name: Authenticate Docker to GCP
        run: |
          gcloud auth configure-docker asia-south2-docker.pkg.dev --quiet

      # Build and Push Docker image
      - name: Docker Build and Push
        run: |
          IMAGE_TAG="asia-south2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/careerkinetic-$ENV-repo/careerkinetic:latest"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      # Deploy Cloud Run by applying the full Terraform configuration
      - name: Terraform Apply Cloud Run
        run: |
          cd terraform
          terraform apply -auto-approve \
            -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="environment=$ENV" \
            -var="database_url=$DB_URL" \
            -var="jwt_secret=$JWT_SEC" \
            -var="cors_origins=$CORS_ORGS" \
            -var="google_client_id=$GOOGLE_ID" \
            -var="google_client_secret=$GOOGLE_SEC" \
            -var="google_redirect_uri=$GOOGLE_URI" \
            -var="github_client_id=$GITHUB_ID" \
            -var="github_client_secret=$GOOGLE_SEC" \
            -var="github_redirect_uri=$GITHUB_URI"
